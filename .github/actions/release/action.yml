name: release
description: release gocredits
inputs:
  tag:
    description: tag name to be released
    default: ''
  token:
    description: GitHub token
    required: true
runs:
  using: composite
  steps:
  - name: setup go
    uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
    with:
      go-version-file: go.mod
  - name: prepare build metadata
    id: build
    run: |
      echo "revision=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
    shell: bash
  - name: build release archives
    id: goxz
    uses: Songmu/goxz@ca593d878bfc0fe683ab80243fad53aeef4bcbfd # v0.11.1
    with:
      package-version: ${{ inputs.tag }}
      os: linux,darwin,windows
      packages: ./cmd/gocredits
      build-ldflags: -s -w -X github.com/Songmu/gocredits.revision=${{ steps.build.outputs.revision }}
  - name: generate checksums
    run: |
      cd "$ARTIFACTS"
      shasum -a 256 * > SHA256SUMS
    shell: bash
    env:
      ARTIFACTS: ${{ steps.goxz.outputs.output-dir }}
  - name: attest build provenance
    uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
    with:
      subject-path: "${{ steps.goxz.outputs.output-dir }}/*"
  - uses: tcnksm/ghr@766f869eacbbb086e8860cf0f0192dda6e8e67e1 # v0.18.3
    with:
      tag: ${{ inputs.tag }}
      token: ${{ inputs.token }}
      path: ${{ steps.goxz.outputs.output-dir }}
  - uses: haya14busa/action-update-semver@7d2c558640ea49e798d46539536190aff8c18715 # v1.5.1
    with:
      github_token: ${{ inputs.token }}
      tag: ${{ inputs.tag }}
      major_version_tag_only: true
