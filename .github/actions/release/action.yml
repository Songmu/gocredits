name: release
description: release gocredits
inputs:
  tag:
    description: tag name to be released
    default: ''
  token:
    description: GitHub token
    required: true
runs:
  using: composite
  steps:
  - name: setup go
    uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
    with:
      go-version-file: go.mod
  - name: verify module files
    run: |
      go mod tidy -diff
    shell: bash
  - name: prepare build metadata
    id: build
    run: |
      echo "ldflags=-s -w -X github.com/Songmu/gocredits.revision=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
    shell: bash
  - name: build release archives
    id: goxz
    uses: Songmu/goxz@3e773e7fb3b761888365d21baa1ed352d9a5563b # v0.11.0
    with:
      package-version: ${{ inputs.tag }}
      os: linux,darwin,windows
      destination: dist
      packages: ./cmd/gocredits
      build-ldflags: ${{ steps.build.outputs.ldflags }}
  - name: generate checksums
    run: |
      cd "$ARTIFACTS"
      shasum -a 256 * > SHA256SUMS
    shell: bash
    env:
      ARTIFACTS: ${{ steps.goxz.outputs.artifacts }}
  - name: attest build provenance
    uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
    with:
      subject-path: "dist/*"
  - uses: tcnksm/ghr@766f869eacbbb086e8860cf0f0192dda6e8e67e1 # v0.18.3
    with:
      tag: ${{ inputs.tag }}
      token: ${{ inputs.token }}
      path: "dist"
  - uses: haya14busa/action-update-semver@7d2c558640ea49e798d46539536190aff8c18715 # v1.5.1
    with:
      github_token: ${{ inputs.token }}
      tag: ${{ inputs.tag }}
      major_version_tag_only: true
