name: test
on:
  pull_request:
    branches:
    - "**"
  push:
    branches:
    - "main"

permissions:
  attestations: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macOS-latest
        - windows-latest
    steps:
    - name: Set git to use LF
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
      if: "matrix.os == 'windows-latest'"
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: setup go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: test
      run: go test -race -coverprofile coverage.out -covermode atomic ./...
    - name: Install gocredits without running it
      id: install-gocredits
      uses: ./
      with:
        run: false
    - name: Test installed gocredits
      env:
        CREDITS: ${{ steps.install-gocredits.outputs.credits }}
        CHANGED: ${{ steps.install-gocredits.outputs.changed }}
      run: |
        test -z "$CREDITS"
        test -z "$CHANGED"
        command -v gocredits
        gocredits -version
    - name: Generate CREDITS with gocredits
      id: gocredits
      uses: ./
    - name: Test gocredits outputs
      env:
        CREDITS: ${{ steps.gocredits.outputs.credits }}
        CHANGED: ${{ steps.gocredits.outputs.changed }}
      run: |
        test -f "$CREDITS"
        case "$CHANGED" in
          true | false)
            ;;
          *)
            echo "unexpected changed output: $CHANGED" >&2
            exit 1
            ;;
        esac
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
